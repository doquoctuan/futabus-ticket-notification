apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: futabus

resources:
  - namespace.yaml
  - configmap.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/name: futabus-backend
  app.kubernetes.io/component: api-server
  app.kubernetes.io/part-of: futabus
  app.kubernetes.io/managed-by: kustomize

# Image configuration
images:
  - name: your-registry/futabus-backend
    newTag: latest

# ConfigMap generator (optional - can replace configmap.yaml)
# configMapGenerator:
#   - name: futabus-backend-config
#     literals:
#       - PORT=8080
#       - DATABASE_PORT=5432

# Secret generator (DON'T commit real secrets)
# secretGenerator:
#   - name: futabus-backend-secret
#     literals:
#       - AUTH0_DOMAIN=your-tenant.auth0.com

# Patches for different environments
patchesStrategicMerge: []
